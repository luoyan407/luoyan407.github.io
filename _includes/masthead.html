<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}<span aria-hidden="true">.</span></a>
    <div class="site-nav__links">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}" {% if page.url == link.url %}aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </div>
  </nav>
</header>
